name: Daily Automated Strongman Scraper & Firebase Deploy

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (7:00 PM EST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub UI

jobs:
  scrape-recalculate-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run StrongmanArchives Incremental Scraper
        run: python scrape_strongman_archives.py

      - name: Recalculate 5-Year Open-Class Rankings
        run: python recalculate_rankings.py

      - name: Commit & Push Updated Dataset back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strongman_contests_dataset.json strongman_contests_filtered.json strongman_contests_ranked_last_5_years.json database_strongman.json frontend/src/services/database_strongman.json
          git diff-index --quiet HEAD || git commit -m "auto: daily scraper & ranking update [skip ci]"
          git push

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
